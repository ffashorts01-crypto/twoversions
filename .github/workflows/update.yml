# twoversions.com - main update every 2 hours (collect -> Qwen cards -> checks -> build -> Cloudflare Pages -> IndexNow -> Telegram).
# Spend caps: $1.00/day (Europe/Berlin), $0.45/run; important clusters first.
# Secrets: DASHSCOPE_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, STATE_KEY, TELEGRAM_BOT_TOKEN, optional TELEGRAM_OWNER_CHAT_ID.
# Schedule: :20 past odd UTC hours = even hours Berlin in winter (CET, UTC+1). In summer (CEST) this becomes odd Berlin hours - harmless.
name: update
on:
  schedule: [{cron: '20 1-23/2 * * *'}]
  workflow_dispatch: {}
concurrency: {group: twoversions-state, cancel-in-progress: false}   # shared with hot-check: runs never overlap
permissions: {contents: write}
env:
  TZ: Europe/Berlin
  BASE_URL: https://twoversions.com
  CONTACT_EMAIL: twoversions@proton.me
  CF_PROJECT: twoversions-site
  WRANGLER: npx --yes wrangler@3
  LLM_PROVIDER: qwen
  LLM_DAILY_BUDGET_USD: ${{ vars.LLM_DAILY_BUDGET_USD || '1' }}
  LLM_RUN_BUDGET_USD: ${{ vars.LLM_RUN_BUDGET_USD || '0.45' }}
  LLM_BUDGET_USD: '1000'
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: pip install -q -r requirements.txt
      - uses: actions/cache@v4
        with: {path: data/og_cache, key: 'og-${{ github.run_id }}', restore-keys: 'og-'}
      - name: restore state
        env: {STATE_KEY: '${{ secrets.STATE_KEY }}'}
        run: bash scripts/state_pull.sh
      - name: update, build, deploy, IndexNow, Telegram
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set +e
          python pipeline/auto_run.py
          code=$?
          tail -3 logs/auto_run.log
          # 3 = budget cap reached (partial results published) - not a failure
          if [ $code -eq 0 ] || [ $code -eq 3 ]; then exit 0; else exit $code; fi
      - name: save state (also after a failed run, so collected articles and Telegram state are kept)
        if: always()
        env: {STATE_KEY: '${{ secrets.STATE_KEY }}', GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: bash scripts/state_push.sh
      - name: notify owner on failure
        if: failure()
        env: {TELEGRAM_BOT_TOKEN: '${{ secrets.TELEGRAM_BOT_TOKEN }}', TELEGRAM_OWNER_CHAT_ID: '${{ secrets.TELEGRAM_OWNER_CHAT_ID }}'}
        run: bash scripts/notify_fail.sh
